name: News Monitor - JL RealEstate

on:
  schedule:
    - cron: '30 1 * * *'   # 14:30 NZDT (UTC+13, Sep–Apr)
    - cron: '30 2 * * *'   # 14:30 NZST (UTC+12, Apr–Sep)
    - cron: '0 5 * * *'    # 18:00 NZDT (UTC+13, Sep–Apr)
    - cron: '0 6 * * *'    # 18:00 NZST (UTC+12, Apr–Sep)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force post (skip interval and dedup checks)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  news:
    runs-on: ubuntu-latest
    environment: JL_RealEstate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Write credentials
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          mkdir -p config/credentials
          printf "FACEBOOK_PAGE_ID=%s\nFACEBOOK_ACCESS_TOKEN=%s\nANTHROPIC_API_KEY=%s\nINSTAGRAM_USER_ID=%s\nINSTAGRAM_ACCESS_TOKEN=%s\nTIKTOK_ACCESS_TOKEN=%s\n" \
            "$FACEBOOK_PAGE_ID" \
            "$FACEBOOK_ACCESS_TOKEN" \
            "$ANTHROPIC_API_KEY" \
            "$INSTAGRAM_USER_ID" \
            "$INSTAGRAM_ACCESS_TOKEN" \
            "$TIKTOK_ACCESS_TOKEN" \
            > config/credentials/JL_RealEstate.env

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      # Phase 1: fetch news, select best article, generate branded image
      - name: Generate news image
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python src/news_monitor.py --industry JL_RealEstate --phase generate --force
          else
            python src/news_monitor.py --industry JL_RealEstate --phase generate
          fi

      # Commit image + pending file so image is publicly accessible via GitHub raw URL
      - name: Commit generated files
        run: |
          git add data/news_images/ data/news_pending/
          git diff --staged --quiet && echo "No new news — skipping commit." || \
            (git commit -m "news: JL_RealEstate image $(date +'%Y%m%d_%H%M%S')" && git push)

      # Wait for GitHub CDN to propagate the committed image before Instagram can access it
      - name: Wait for CDN propagation
        run: sleep 15

      # Phase 2: post to Facebook (direct upload) and Instagram (GitHub raw URL)
      - name: Post to platforms
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python src/news_monitor.py --industry JL_RealEstate --phase post

      # Commit result + updated seen_state.json + stage pending file deletion
      - name: Commit posting results
        run: |
          git add data/news_posted/ data/news_pending/
          git diff --staged --quiet && echo "No changes to commit." || \
            (git commit -m "news: JL_RealEstate posted $(date +'%Y%m%d_%H%M%S')" && git pull --rebase && git push)
