name: Post - JL RealEstate

on:
  workflow_dispatch:   # triggered explicitly by schedule_JL_RealEstate.yml via gh workflow run
  # NOTE: on: push removed — the scheduler calls `gh workflow run` after pushing the pending
  # file. Keeping both triggers caused two concurrent runs and double-posting to Facebook.

# Prevent concurrent post runs for the same brand (e.g. if workflow_dispatch races itself)
concurrency:
  group: post-JL_RealEstate
  cancel-in-progress: false   # let the first run finish; don't cancel it

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    environment: JL_RealEstate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_DEFAULT_IMAGE_URL: ${{ secrets.INSTAGRAM_DEFAULT_IMAGE_URL }}
        run: |
          mkdir -p config/credentials
          printf "FACEBOOK_PAGE_ID=%s\nFACEBOOK_ACCESS_TOKEN=%s\nANTHROPIC_API_KEY=%s\nINSTAGRAM_USER_ID=%s\nINSTAGRAM_ACCESS_TOKEN=%s\nINSTAGRAM_DEFAULT_IMAGE_URL=%s\n" \
            "$FACEBOOK_PAGE_ID" \
            "$FACEBOOK_ACCESS_TOKEN" \
            "$ANTHROPIC_API_KEY" \
            "$INSTAGRAM_USER_ID" \
            "$INSTAGRAM_ACCESS_TOKEN" \
            "$INSTAGRAM_DEFAULT_IMAGE_URL" \
            > config/credentials/JL_RealEstate.env

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Wait for GitHub CDN propagation
        run: sleep 30

      - name: Post to platforms
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py --industry JL_RealEstate

      - name: Commit results back to repo
        run: |
          git add data/content_ready/ data/content_posted/
          git diff --staged --quiet || git commit -m "posted: JL_RealEstate $(date +'%Y%m%d_%H%M%S')"
          git push
